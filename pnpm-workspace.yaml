packages:
  - 'apps/*'
  - 'packages/*'

# Dependency build/postinstall scripts (pnpm 11 `allowBuilds`, which replaced
# `onlyBuiltDependencies`). Anything with a script that is not listed fails the install.
allowBuilds:
  '@prisma/client': true
  '@prisma/engines': true
  prisma: true
  argon2: true
  '@scarf/scarf': true
  # Its postinstall is only a version check; not needed.
  protobufjs: false
  # Optional native addons pulled in by Testcontainers (Docker over SSH); the JS
  # fallbacks are enough for the e2e tests.
  cpu-features: false
  ssh2: false
